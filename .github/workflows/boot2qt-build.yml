name: Boot to Qt Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      keep_ec2:
        description: 'Keep EC2 instance running after workflow completes'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  trigger-codebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      
      - name: Run CodeBuild
        id: codebuild
        uses: aws-actions/aws-codebuild-run-build@v1
        with:
          project-name: antares-cluster-boot2qt-docker

      - name: Set build env vars
        if: always()
        run: |
          BUILD_ID="${{ steps.codebuild.outputs.aws-build-id }}"
          echo "BUILD_ID=$BUILD_ID" >> $GITHUB_ENV
          if [ "${{ steps.codebuild.outcome }}" = "failure" ]; then
            echo "FAILED_BUILD_ID=$BUILD_ID" >> $GITHUB_ENV
            echo "FAILED_BUILD_STATUS=FAILED" >> $GITHUB_ENV
          fi
      
      - name: Checkout repository for deployment scripts
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Download build artifacts for deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Downloading build artifacts from GitHub release..."
          
          # Get the build number from CodeBuild
          BUILD_NUMBER=$(aws codebuild batch-get-builds --ids "$BUILD_ID" --query 'builds[0].buildNumber' --output text)
          RELEASE_TAG="boot2qt-build-${BUILD_NUMBER}"
          
          echo "Downloading from release: $RELEASE_TAG"
          
          # Download the tarball from the GitHub release
          gh release download "$RELEASE_TAG" --repo "${{ github.repository }}" --pattern "antares-cluster-boot2qt-*.tar.gz"
          
          # Create artifacts directory and extract
          mkdir -p build-artifacts
          TARBALL=$(ls antares-cluster-boot2qt-*.tar.gz | head -1)
          
          if [ -f "$TARBALL" ]; then
            tar -xzf "$TARBALL" -C build-artifacts/
            echo "Build artifacts extracted successfully"
            ls -la build-artifacts/
          else
            echo "No tarball found in release"
            exit 1
          fi
      
      - name: Deploy to EC2 instance
        env:
          EC2_KEY_NAME: ${{ secrets.EC2_KEY_NAME }}
          EC2_SECURITY_GROUP: ${{ secrets.EC2_SECURITY_GROUP }}
          EC2_SUBNET_ID: ${{ secrets.EC2_SUBNET_ID }}
          EC2_PRIVATE_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
        run: |
          echo "Deploying successful build to EC2 instance..."
          
          # Make deployment script executable
          chmod +x .github/workflows/deploy-to-ec2.sh
          
          # Run deployment
          ./.github/workflows/deploy-to-ec2.sh
      
      - name: Restore Squish cache
        if: success()
        id: squish-cache
        uses: actions/cache@v4
        with:
          path: ~/squish
          key: squish-runner-9.2.0-qt68x-linux64

      - name: Install Squish runner on GitHub runner
        if: success() && steps.squish-cache.outputs.cache-hit != 'true'
        env:
          SQUISH_PACKAGE_S3: ${{ secrets.SQUISH_PACKAGE_S3 }}
          SQUISH_LICENSE_KEY: ${{ secrets.SQUISH_LICENSE_KEY }}
        run: |
          SQUISH_INSTALL_DIR="$HOME/squish"

          if [ -z "$SQUISH_PACKAGE_S3" ]; then
            echo "=========================================================="
            echo "ACTION REQUIRED: Set the SQUISH_PACKAGE_S3 secret"
            echo "=========================================================="
            echo ""
            echo "Upload the Squish for Qt Linux x64 package to S3 and set"
            echo "the SQUISH_PACKAGE_S3 repository secret to the S3 URI, e.g.:"
            echo "  s3://antares-squish-packages/squish-9.2.0-qt68x-linux64.run"
            exit 1
          fi

          # Installer binary is linked against X11 libs even in unattended mode
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libxkbcommon-x11-0 >/dev/null 2>&1

          echo "Downloading Squish from S3: $SQUISH_PACKAGE_S3"
          SQUISH_PKG="/tmp/squish-installer"
          aws s3 cp "$SQUISH_PACKAGE_S3" "$SQUISH_PKG"
          chmod +x "$SQUISH_PKG"

          echo "Installing Squish to $SQUISH_INSTALL_DIR..."
          mkdir -p "$SQUISH_INSTALL_DIR"
          # Squish .run uses Qt IFW — unattended=1 for headless CI
          "$SQUISH_PKG" unattended=1 targetdir="$SQUISH_INSTALL_DIR" license-key="$SQUISH_LICENSE_KEY" ide=0 doc=0 examples=0 \
            || { echo "ERROR: Squish installer failed"; exit 1; }

          rm -f "$SQUISH_PKG"

          if [ ! -x "$SQUISH_INSTALL_DIR/bin/squishrunner" ]; then
            echo "ERROR: squishrunner not found after installation"
            find "$SQUISH_INSTALL_DIR" -type f -executable | head -n 20
            exit 1
          fi

          echo "Squish installed: $SQUISH_INSTALL_DIR/bin/squishrunner"
          "$SQUISH_INSTALL_DIR/bin/squishrunner" --version || true

      - name: Set Squish env
        if: success()
        run: |
          echo "SQUISH_DIR=$HOME/squish" >> $GITHUB_ENV
          echo "Squish runner: $HOME/squish/bin/squishrunner"
          "$HOME/squish/bin/squishrunner" --version || true

      - name: Start squishserver on EC2
        if: success()
        env:
          EC2_PRIVATE_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
          PUBLIC_IP: ${{ env.PUBLIC_IP }}
          SQUISH_LICENSE_KEY: ${{ secrets.SQUISH_LICENSE_KEY }}
        run: |
          KEY_FILE="/tmp/deployment-key.pem"

          echo "Configuring squishserver on EC2 target..."
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -i "$KEY_FILE" \
            user@"$PUBLIC_IP" bash -s "$SQUISH_LICENSE_KEY" << 'REMOTE_SCRIPT'
          set -e
          SQUISH_LICENSE_KEY_ARG="$1"

          # Find squishserver from the embedded install
          SQUISH_SERVER=$(find /opt/[Ss]quish* -name "squishserver" -type f 2>/dev/null | head -n 1)
          if [ -z "$SQUISH_SERVER" ]; then
            echo "ERROR: squishserver not found on target"
            ls /opt/
            exit 1
          fi
          echo "squishserver: $SQUISH_SERVER"

          # Configure Squish license
          mkdir -p ~/.squish
          if [ -n "$SQUISH_LICENSE_KEY_ARG" ]; then
            echo "$SQUISH_LICENSE_KEY_ARG" > ~/.squish/license
            echo "Squish license configured"
          else
            echo "WARNING: No Squish license key provided"
          fi

          # Kill any existing ClusterApp — Squish will manage AUT lifecycle
          killall ClusterApp 2>/dev/null || true

          # Stop any existing squishserver
          "$SQUISH_SERVER" --stop 2>/dev/null || true
          sleep 1

          # Register the AUT
          "$SQUISH_SERVER" --config addAUT ClusterApp /opt/antares

          # Start squishserver listening on all interfaces for remote squishrunner
          # nohup + redirect so SSH session can disconnect cleanly
          nohup "$SQUISH_SERVER" --verbose --host 0.0.0.0 > /tmp/squishserver.log 2>&1 &
          SQUISH_SERVER_PID=$!
          sleep 3

          if ! kill -0 $SQUISH_SERVER_PID 2>/dev/null; then
            echo "ERROR: squishserver failed to start"
            cat /tmp/squishserver.log
            exit 1
          fi
          echo "squishserver running (PID: $SQUISH_SERVER_PID) on port 4322"
          REMOTE_SCRIPT

          echo "squishserver ready on EC2"

      - name: Install Squish Python dependencies
        if: success()
        run: |
          # squishrunner uses system Python to execute test scripts
          pip install websockets

      - name: Run Squish tests from host
        if: success()
        env:
          SQUISH_LICENSE_KEY: ${{ secrets.SQUISH_LICENSE_KEY }}
          PUBLIC_IP: ${{ env.PUBLIC_IP }}
        run: |
          SQUISH_RUNNER="$SQUISH_DIR/bin/squishrunner"

          # Configure license on the runner as well
          mkdir -p ~/.squish
          if [ -n "$SQUISH_LICENSE_KEY" ]; then
            echo "$SQUISH_LICENSE_KEY" > ~/.squish/license
          fi

          echo "=========================================="
          echo "Executing test suite: suite_antares-basic"
          echo "Host:   $(hostname) (squishrunner)"
          echo "Target: $PUBLIC_IP (squishserver:4322)"
          echo "=========================================="

          TEST_EXIT=0
          "$SQUISH_RUNNER" \
            --host "$PUBLIC_IP" \
            --port 4322 \
            --testsuite Cluster/test/suite_antares-basic \
            --reportgen xml3,squish_results.xml \
            --reportgen stdout \
            --exitCodeOnFail 0 \
            || TEST_EXIT=$?

          echo "Squish tests completed (exit code: $TEST_EXIT)"

          if [ -f squish_results.xml ]; then
            echo "Results file size: $(wc -c < squish_results.xml) bytes"
            PASSES=$(grep -c '<test.*result="PASS"' squish_results.xml 2>/dev/null || echo "0")
            FAILS=$(grep -c '<test.*result="FAIL"' squish_results.xml 2>/dev/null || echo "0")
            ERRORS=$(grep -c '<test.*result="ERROR"' squish_results.xml 2>/dev/null || echo "0")
            echo "Results: $PASSES passed, $FAILS failed, $ERRORS errors"
          else
            echo "ERROR: No squish_results.xml generated"
            exit 1
          fi

          exit $TEST_EXIT

      - name: Collect Squish results and cluster logs
        if: success() || failure()
        env:
          EC2_PRIVATE_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
          PUBLIC_IP: ${{ env.PUBLIC_IP }}
          INSTANCE_ID: ${{ env.INSTANCE_ID }}
        run: |
          KEY_FILE="/tmp/deployment-key.pem"
          rm -f "$KEY_FILE"
          echo "$EC2_PRIVATE_KEY" > "$KEY_FILE"
          chmod 400 "$KEY_FILE"

          # squish_results.xml is already local (generated by squishrunner on this runner)
          if [ -f "squish_results.xml" ]; then
            echo "squish_results.xml present ($(wc -c < squish_results.xml) bytes)"
          else
            echo "<SquishReport>No results collected</SquishReport>" > squish_results.xml
          fi

          # Download cluster.log from EC2
          if [ -n "$PUBLIC_IP" ]; then
            scp -o StrictHostKeyChecking=no -i "$KEY_FILE" \
              user@"$PUBLIC_IP":/opt/antares/cluster.log ./cluster.log 2>/dev/null || echo "No cluster.log found"

            if [ -f "cluster.log" ]; then
              echo "cluster.log downloaded ($(wc -l < cluster.log) lines)"
            else
              echo "No cluster log available" > cluster.log
            fi
          else
            echo "No PUBLIC_IP available" > cluster.log
          fi

          # Print cluster.log to console for visibility
          echo "=========================================="
          echo "cluster.log contents:"
          echo "=========================================="
          cat cluster.log
          echo "=========================================="

      - name: Analyze Squish results with Claude Code
        if: always() && (success() || failure())
        env:
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f "squish_results.xml" ] && [ ! -f "cluster.log" ]; then
            echo "No test results or logs to analyze"
            exit 0
          fi

          echo "Installing Claude Code CLI..."
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.claude/bin" >> $GITHUB_PATH

          # Configure git for branch/PR creation
          git config user.name "claude-code[bot]"
          git config user.email "claude-code[bot]@users.noreply.github.com"

          cat > squish_analysis_prompt.md << 'PROMPT_EOF'
          # Squish Test Results Analysis

          Analyze the Squish GUI test results and cluster deployment logs from our
          EC2 Boot2Qt instance.

          **Context:**
          - Application: Antares ClusterApp (automotive instrument cluster)
          - Platform: Boot2Qt 6.8.3 on g5g.xlarge (GPU ARM64)
          - Test Suite: suite_antares-basic (speed, themes, telltales, ADAS, doors, units)
          - Squish results XML: `squish_results.xml`
          - Application logs: `cluster.log`

          **Your Task:**
          1. Parse `squish_results.xml` and summarize pass/fail counts per test case
          2. For any FAILED or ERROR tests, identify the root cause from the XML details
          3. Cross-reference failures with `cluster.log` for runtime errors
          4. If there are test failures that appear to be caused by application bugs
             (not test infrastructure issues):
             - Examine the relevant QML/C++ source files in the repository
             - Create a fix branch, commit the fix, and open a draft PR
             - Branch name: fix/squish-failures-${{ github.run_number }}
             - The PR body must include the full test results summary
          5. If all tests pass, just create a summary comment on the workflow run

          **Important:**
          - Use `git checkout -b fix/squish-failures-${{ github.run_number }}` for the branch
          - After fixing, commit and push, then use `gh pr create --draft`
          - If failures are infrastructure-only (Squish connection, license, timeout),
            do NOT create a fix PR -- create a GitHub issue instead
          - Always include the test results table in your PR body or issue

          Start by reading squish_results.xml and cluster.log.
          PROMPT_EOF

          echo "$(cat squish_analysis_prompt.md)" | claude --dangerously-skip-permissions

          rm -f squish_analysis_prompt.md
      
      - name: Cleanup EC2 instance
        if: always() && github.event.inputs.keep_ec2 != 'true'
        run: |
          if [ -n "$INSTANCE_ID" ]; then
            echo "Terminating EC2 instance: $INSTANCE_ID"
            aws ec2 terminate-instances --instance-ids "$INSTANCE_ID"
            echo "Instance $INSTANCE_ID terminated"
          else
            echo "No instance ID found to terminate"
          fi

      - name: Report EC2 instance kept alive
        if: always() && github.event.inputs.keep_ec2 == 'true'
        run: |
          echo "EC2 instance kept running per workflow input"
          echo "Instance ID: $INSTANCE_ID"
          echo "Public IP: $PUBLIC_IP"
          echo "SSH: ssh -i <key> user@$PUBLIC_IP"
      
      
      - name: Checkout repository for Claude Code analysis
        if: failure() && env.FAILED_BUILD_ID
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Install Claude Code CLI
        if: failure() && env.FAILED_BUILD_ID
        run: |
          echo "Installing Claude Code CLI..."
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.claude/bin" >> $GITHUB_PATH
          claude --version
      
      - name: Configure Claude Code
        if: failure() && env.FAILED_BUILD_ID
        env:
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: |
          echo "Configuring Claude Code..."
          echo "API key configured via environment variable"
      
      - name: Fetch build logs for Claude analysis
        if: failure() && env.FAILED_BUILD_ID
        run: |
          echo "Fetching CodeBuild logs..."
          LOG_GROUP=$(aws codebuild batch-get-builds --ids "$FAILED_BUILD_ID" --query 'builds[0].logs.groupName' --output text)
          LOG_STREAM=$(aws codebuild batch-get-builds --ids "$FAILED_BUILD_ID" --query 'builds[0].logs.streamName' --output text)
          
          if [ "$LOG_GROUP" != "None" ] && [ "$LOG_STREAM" != "None" ]; then
            aws logs get-log-events \
              --log-group-name "$LOG_GROUP" \
              --log-stream-name "$LOG_STREAM" \
              --limit 200 \
              --query 'events[*].message' \
              --output text > codebuild_failure_logs.txt
            echo "Build logs saved to codebuild_failure_logs.txt"
          else
            echo "No build logs available" > codebuild_failure_logs.txt
          fi
      
      - name: Analyze and fix build failure with Claude Code
        if: failure() && env.FAILED_BUILD_ID
        env:
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Running Claude Code to analyze and fix the build failure..."
          
          # Create a comprehensive prompt for Claude Code
          cat > fix_build_failure_prompt.md << 'EOF'
          # CodeBuild Failure Auto-Fix Request
          
          I need you to analyze and fix this CodeBuild failure:
          
          **Build Details:**
          - Build ID: ${{ env.FAILED_BUILD_ID }}
          - Status: ${{ env.FAILED_BUILD_STATUS }}  
          - Project: antares-cluster-boot2qt-docker
          - Workflow: Boot to Qt Build
          
          **Your Task:**
          1. Examine the build failure logs in `codebuild_failure_logs.txt`
          2. Analyze the repository structure and build scripts
          3. Identify the root cause of the failure
          4. Make the necessary code changes to fix the issue
          5. Create a branch and PR with your fixes
          
          **Key Files to Consider:**
          - `.github/workflows/build-boot2qt.sh` (main build script)
          - `.github/workflows/boot2qt-build.yml` (workflow definition)
          - Any CMake files or configuration that might be causing issues
          
          **Requirements:**
          - IMPORTANT: Actually modify the files to fix the problem using Edit tool
          - Create a new branch with: git checkout -b fix/codebuild-${{ env.FAILED_BUILD_ID }}
          - After making changes, write a descriptive commit message based on what you fixed
          - Commit with: git add . && git commit -m "your descriptive message here"
          - Push branch with: git push origin fix/codebuild-${{ env.FAILED_BUILD_ID }}
          - Create PR with a descriptive title and body explaining the fix you made
          - Use: gh pr create --title "Your descriptive PR title" --body "Detailed explanation of fix" --draft
          - This is running in GitHub Actions - you MUST actually execute these commands
          
          Please start by reading the failure logs and then systematically work through the fix.
          EOF
          
          # Run Claude Code with the prompt in interactive mode
          echo "$(cat fix_build_failure_prompt.md)" | claude --dangerously-skip-permissions
          
          # Clean up temporary files that shouldn't be committed
          rm -f fix_build_failure_prompt.md codebuild_failure_logs.txt
      
      - name: Setup git for PR creation
        if: failure() && env.FAILED_BUILD_ID
        run: |
          git config user.name "claude-code[bot]"
          git config user.email "claude-code[bot]@users.noreply.github.com"
      
      - name: Create fallback issue if no PR was created
        if: failure() && env.FAILED_BUILD_ID
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Check if Claude Code already created a PR
          if gh pr list --head "fix/codebuild-${{ env.FAILED_BUILD_ID }}" --json number | grep -q "number"; then
            echo "PR already created by Claude Code for this build"
          elif git diff --quiet && git diff --cached --quiet; then
            echo "No changes were made by Claude Code. Creating issue instead..."
            
            # Read the logs for issue context
            LOGS_PREVIEW=$(head -50 codebuild_failure_logs.txt)
            
            gh issue create \
              --title "CodeBuild Failure - Build ${{ env.FAILED_BUILD_ID }}" \
              --body "## CodeBuild Failure Report
          
          **Build Details:**
          - Build ID: \`${{ env.FAILED_BUILD_ID }}\`
          - Status: \`${{ env.FAILED_BUILD_STATUS }}\`
          - Workflow Run: ${{ github.run_id }}
          - Project: antares-cluster-boot2qt-docker
          
          ## Build Logs Preview
          \`\`\`
          $LOGS_PREVIEW
          \`\`\`
          
          ## Action Required
          Claude Code was unable to automatically fix this build failure. Manual investigation is required.
          
          **Next Steps:**
          1. Review the full build logs in AWS CodeBuild console
          2. Examine the build script: \`.github/workflows/build-boot2qt.sh\`
          3. Check for dependency or configuration issues
          
          ---
          *This issue was automatically created after Claude Code analysis.*" \
              --label "bug,codebuild-failure,needs-investigation"
          else
            echo "Changes were made by Claude Code - PR should have been created"
          fi
